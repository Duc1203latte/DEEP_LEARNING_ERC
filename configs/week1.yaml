output_dir: outputs/week1_demo
asr_model: Systran/faster-whisper-base.en
asr_local_files_only: false
asr_device: cpu
asr_compute_type: int8
language: en
beam_size: 5
num_threads: 4
segmentation_model: outputs/demo_models/segmentation.onnx
embedding_model: outputs/demo_models/speaker_embedding.onnx
num_speakers: -1
cluster_threshold: 0.35
min_duration_on: 0.3
min_duration_off: 0.5
word_gap_limit: 0.7
merge_short_seconds: 1.5
max_video_seconds: 600
ffmpeg_timeout: 180
sample_rate: 16000
max_utterance_seconds: 9.99
